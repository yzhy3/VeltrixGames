    '</div>';

  $('app').innerHTML=

    /* GAMES */
    '<div class="panel on" id="p-games">'+

    '<div class="g"><div><label>Tipo (MOD APK)</label><input id="f_badge"></div><div><label>Etiqueta (NUEVO)</label><input id="f_label"></div></div>'+
    '<label>Color etiqueta</label><input id="f_color" value="#EF4444">'+

    '<div class="row" style="margin-bottom:12px"><input type="checkbox" id="f_active" checked style="width:auto;margin:0"><label style="margin:0;font-size:13px;color:#f8fafc">Activo</label></div>'+

/* ===== SETTINGS / MAINTENANCE ===== */
function loadSettings(){
  db.collection('settings').doc('site').get().then(function(d){
    settings=d.exists?d.data():{};
    renderSettings();
  }).catch(function(){settings={};renderSettings()});
}
function renderSettings(){
  var s=settings||{};
  var maint=!!s.maintenance;
  var chatOff=!!s.chatDisabled;
  var revOff=!!s.reviewsDisabled;
  $('siteCard').innerHTML=
    '<div class="switch"><div><b>Modo mantenimiento</b><div class="muted" style="font-size:12px">La web muestra aviso y limita el uso</div></div>'+
    '<div class="sw '+(maint?'on':'')+'" id="swMaint" onclick="toggleSw(\'maintenance\')"><i></i></div></div>'+
    '<label style="margin-top:12px">Mensaje de mantenimiento</label>'+
    '<textarea id="maintMsg" placeholder="Estamos en mantenimiento. Vuelve pronto.">'+esc(s.maintenanceMessage||'')+'</textarea>'+
    '<div class="switch"><div><b>Desactivar chat</b><div class="muted" style="font-size:12px">Nadie puede enviar mensajes</div></div>'+
    '<div class="sw '+(chatOff?'on':'')+'" id="swChat" onclick="toggleSw(\'chatDisabled\')"><i></i></div></div>'+
    '<div class="switch"><div><b>Desactivar reseñas</b><div class="muted" style="font-size:12px">Nadie puede publicar reseñas</div></div>'+
    '<div class="sw '+(revOff?'on':'')+'" id="swRev" onclick="toggleSw(\'reviewsDisabled\')"><i></i></div></div>'+
    '<label style="margin-top:12px">OpenAI API Key (moderación IA)</label>'+'<input id="openaiKey" type="password" placeholder="sk-..." value="'+esc(s.openaiKey||'')+'">'+'<p class="muted" style="font-size:11px;margin-bottom:10px">Usa el endpoint de Moderations de OpenAI (recomendado).</p>'+'<label>Gemini API Key (alternativa)</label>'+'<input id="geminiKey" type="password" placeholder="AIza..." value="'+esc(s.geminiKey||'')+'">'+'<p class="muted" style="font-size:11px;margin-bottom:10px">Si no hay OpenAI, se usa Gemini. Sin keys = filtro básico local.</p>'+'<label style="margin-top:12px">Anuncio global (banner)</label>'+
    '<input id="announce" placeholder="Ej: Nuevo juego disponible" value="'+esc(s.announcement||'')+'">'+
    '<label>Título del sitio</label>'+
    '<input id="siteTitle" placeholder="Veltrix Games" value="'+esc(s.siteTitle||'')+'">'+
    '<button class="w ok" style="margin-top:8px" onclick="saveSettings()">Guardar ajustes</button>';
}
function toggleSw(key){
  settings[key]=!settings[key];
  renderSettings();
}
function saveSettings(){
  var data={
    maintenance:!!settings.maintenance,
    chatDisabled:!!settings.chatDisabled,
    reviewsDisabled:!!settings.reviewsDisabled,
    maintenanceMessage:($('maintMsg').value||'').trim()||'Estamos en mantenimiento. Vuelve pronto.',
    announcement:($('announce').value||'').trim(),
    openaiKey:($('openaiKey').value||'').trim(),
    geminiKey:($('geminiKey').value||'').trim(),
    siteTitle:($('siteTitle').value||'').trim()||'Veltrix Games',
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy:auth.currentUser.uid
  };
  db.collection('settings').doc('site').set(data,{merge:true}).then(function(){
    settings=Object.assign(settings,data);
    toast('Ajustes guardados');
  }).catch(function(e){console.log(e);toast('Error al guardar',1)});
}

/* ===== BANS ===== */
function banUser(){
  var uid=$('banUid').value.trim();
  var reason=($('banReason').value||'').trim()||'Sin motivo';
  if(!uid||uid.length<8)return toast('UID inválido',1);
  if(uid===auth.currentUser.uid)return toast('No puedes banearte a ti mismo',1);
  db.collection('bans').doc(uid).set({
    reason:reason,
    bannedBy:auth.currentUser.uid,
    bannedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){toast('Usuario baneado');$('banUid').value='';$('banReason').value='';loadBans()})
    .catch(function(e){console.log(e);toast('No se pudo banear',1)});
}
function unbanUser(uid){
  if(!confirm('¿Quitar ban?'))return;
  db.collection('bans').doc(uid).delete().then(function(){toast('Ban eliminado');loadBans()}).catch(function(){toast('Error',1)});
}
function loadReports(){
  db.collection('reports').orderBy('createdAt','desc').limit(50).get().then(function(s){
    var box=$('reportsList');if(!box)return;
    if(!s.docs.length){box.innerHTML='<p class="muted">Sin reportes.</p>';return}
    box.innerHTML=s.docs.map(function(d){
      var x=d.data();
      var when=x.createdAt&&x.createdAt.toDate?x.createdAt.toDate().toLocaleString():'';
      return '<div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:13px">'+(x.type||'?').toUpperCase()+'</b><span class="muted" style="font-size:11px">'+esc(when)+'</span></div>'+
        '<div class="muted" style="margin-top:6px;font-size:12px">Por: '+esc(x.name||'')+' · '+esc(x.uid||'')+'</div>'+
        '<div style="margin-top:6px;font-size:13px"><b>Motivo:</b> '+esc(x.reason||'')+'</div>'+
        (x.game_title?'<div class="muted" style="font-size:12px;margin-top:4px">Juego: '+esc(x.game_title)+' ('+esc(x.game_id||'')+')</div>':'')+
        (x.msg_text?'<div class="muted" style="font-size:12px;margin-top:4px">Msg: '+esc(x.msg_text)+'</div>':'')+
        '<div class="row" style="margin-top:10px"><button class="ok" style="padding:8px 12px;font-size:11px" onclick="closeReport(\''+esc(d.id)+'\')">Cerrar</button>'+
        (x.msg_id?'<button class="dng" style="padding:8px 12px;font-size:11px" onclick="delChat(\''+esc(x.msg_id)+'\')">Borrar msg</button>':'')+
        (x.msg_uid?'<button class="dng" style="padding:8px 12px;font-size:11px" onclick="banFromUsers(\''+esc(x.msg_uid)+'\')">Banear autor</button>':'')+
        '</div></div>';
    }).join('');
  }).catch(function(e){
    var box=$('reportsList');
    if(box)box.innerHTML='<p class="muted">Error: '+esc(e.message)+'. Puede faltar índice en Firestore.</p>';
  });
}
function closeReport(id){
  db.collection('reports').doc(id).update({status:'closed'}).then(function(){toast('Cerrado');loadReports()}).catch(function(){toast('Error',1)});
}
function loadBans(){
  db.collection('bans').get().then(function(s){
    var box=$('banList');if(!box)return;
    if(!s.docs.length){box.innerHTML='<p class="muted">Nadie baneado.</p>';return}
    box.innerHTML=s.docs.map(function(d){
      var x=d.data();
      return '<div class="card"><div class="row" style="justify-content:space-between"><div style="flex:1;min-width:0"><code style="margin:0">'+esc(d.id)+'</code><div class="muted" style="font-size:12px;margin-top:4px">'+esc(x.reason||'')+'</div></div><button class="ok" style="padding:8px 12px" onclick="unbanUser(\''+esc(d.id)+'\')">Quitar ban</button></div></div>';
    }).join('');
  }).catch(function(){$('banList').innerHTML='<p class="muted">Error cargando bans</p>'});
}

/* ===== CHAT MOD ===== */
function loadChatMod(){
  db.collection('chat').orderBy('createdAt','desc').limit(40).get().then(function(s){
    var box=$('chatMod');if(!box)return;
    if(!s.docs.length){box.innerHTML='<p class="muted">Sin mensajes</p>';return}
    box.innerHTML=s.docs.map(function(d){
      var m=d.data();
      return '<div style="border-bottom:1px solid #1C1C24;padding:10px 0"><div class="row" style="justify-content:space-between"><b style="font-size:13px">'+esc(m.name||'?')+'</b><button class="dng" style="padding:6px 10px;font-size:11px" onclick="delChat(\''+esc(d.id)+'\')">Borrar</button></div><div class="muted" style="font-size:13px;margin-top:4px">'+esc(m.text||'')+'</div><div class="muted" style="font-size:10px;margin-top:2px">uid: '+esc(m.uid||'')+'</div></div>';
    }).join('');
  }).catch(function(e){$('chatMod').innerHTML='<p class="muted">Error: '+esc(e.message)+'</p>'});
}
function delChat(id){
  if(!confirm('¿Borrar mensaje?'))return;
  db.collection('chat').doc(id).delete().then(function(){toast('Borrado');loadChatMod()}).catch(function(){toast('Error',1)});
}

/* ===== STATS ===== */
function loadStats(){
  Promise.all([
    db.collection('games').get(),
    db.collection('reviews').get(),
    db.collection('chat').get(),
    db.collection('bans').get(),
    db.collection('admins').get()
  ]).then(function(arr){
    var g=arr[0].size,r=arr[1].size,c=arr[2].size,b=arr[3].size,a=arr[4].size;
    var active=arr[0].docs.filter(function(d){return d.data().is_active!==false}).length;
    $('statsGrid').innerHTML=
      '<div class="stat"><b>'+g+'</b><span>Juegos</span></div>'+
      '<div class="stat"><b>'+active+'</b><span>Activos</span></div>'+
      '<div class="stat"><b>'+r+'</b><span>Reseñas</span></div>'+
      '<div class="stat"><b>'+c+'</b><span>Msgs chat</span></div>'+
      '<div class="stat"><b>'+b+'</b><span>Baneados</span></div>'+
      '<div class="stat"><b>'+a+'</b><span>Admins</span></div>';
  }).catch(function(){$('statsGrid').innerHTML='<p class="muted">No se pudieron cargar stats</p>'});
}

/* ===== ADMINS ===== */
function addAdmin(){
  var uid=$('adminUid').value.trim();
  if(!uid||uid.length<8)return toast('UID inválido',1);
  db.collection('admins').doc(uid).set({addedBy:auth.currentUser.uid,addedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){toast('Admin agregado');$('adminUid').value='';loadAdmins()}).catch(function(){toast('Error',1)});
}
function removeAdmin(uid){
  if(!confirm('¿Quitar admin?'))return;
  db.collection('admins').doc(uid).delete().then(function(){toast('Quitado');loadAdmins()}).catch(function(){toast('Error',1)});
}
function loadAdmins(){
  db.collection('admins').get().then(function(s){
    var box=$('adminsList');if(!box)return;
    box.innerHTML=s.docs.length?s.docs.map(function(d){return '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid #1C1C24"><code style="margin:0;flex:1">'+esc(d.id)+'</code><button class="dng" style="padding:8px 12px" onclick="removeAdmin(\''+esc(d.id)+'\')">Quitar</button></div>'}).join(''):'<p class="muted">Sin admins aún.</p>';
  });
}


/* ===== USERS ===== */
var _usersCache=[];
function loadUsers(){
  Promise.all([
    db.collection('users').get(),
    db.collection('bans').get(),
    db.collection('admins').get(),
    db.collection('creators').get()
  ]).then(function(arr){
    var bans=new Set(arr[1].docs.map(function(d){return d.id}));
    var admins=new Set(arr[2].docs.map(function(d){return d.id}));
    var creators=new Set(arr[3].docs.map(function(d){return d.id}));
    _usersCache=arr[0].docs.map(function(d){
      var x=d.data();x.uid=d.id;x.banned=bans.has(d.id);x.isAdmin=admins.has(d.id);x.isCreator=creators.has(d.id);x.verified=!!x.verified;return x;
    }).sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
    filterUsers();
  }).catch(function(e){
    var box=$('usersList');if(box)box.innerHTML='<p class="muted">Error: '+esc(e.message)+'</p>';
  });
}
function filterUsers(){
  var q=(($('userSearch')&&$('userSearch').value)||'').trim().toLowerCase();
  var list=_usersCache.filter(function(u){
    if(!q)return true;
    return (u.name||'').toLowerCase().indexOf(q)>=0||(u.email||'').toLowerCase().indexOf(q)>=0||(u.uid||'').toLowerCase().indexOf(q)>=0;
  });
  var box=$('usersList');if(!box)return;
  if(!list.length){box.innerHTML='<p class="muted">No hay usuarios'+(q?' con ese filtro':'')+'.</p>';return}
  box.innerHTML=list.map(function(u){
    var tags='';
    if(u.verified)tags+='<span class="badge" style="background:#1D9BF0">✓ VERIFICADO</span> ';
    if(u.isCreator)tags+='<span class="badge cr">CREADOR</span> ';
    else if(u.isAdmin)tags+='<span class="badge">ADMIN</span> ';
    if(u.banned)tags+='<span class="badge off">BAN</span> ';
    var extra=Array.isArray(u.badges)?u.badges:[];
    var badgeColors={vip:'#a855f7',mod:'#10b981',helper:'#3b82f6',partner:'#f59e0b',pro:'#ec4899',og:'#f97316',staff:'#6366f1'};
    extra.forEach(function(k){if(badgeColors[k])tags+='<span class="badge" style="background:'+badgeColors[k]+'">'+k.toUpperCase()+'</span> ';});
    var actions='';
    if(!u.isCreator){
      if(u.banned)actions+='<button class="ok" style="padding:8px 10px;font-size:11px" onclick="unbanUser(\''+esc(u.uid)+'\');setTimeout(loadUsers,500)">Quitar ban</button>';
      else actions+='<button class="dng" style="padding:8px 10px;font-size:11px" onclick="banFromUsers(\''+esc(u.uid)+'\')">Banear</button>';
      if(isCreator&&!u.isAdmin)actions+='<button class="sec" style="padding:8px 10px;font-size:11px" onclick="makeAdminFromUsers(\''+esc(u.uid)+'\')">Hacer admin</button>';
      if(isCreator&&u.isAdmin)actions+='<button class="sec" style="padding:8px 10px;font-size:11px" onclick="removeAdmin(\''+esc(u.uid)+'\');setTimeout(loadUsers,500)">Quitar admin</button>';
      actions+='<button class="dng" style="padding:8px 10px;font-size:11px;background:#7f1d1d" onclick="deleteUser(\''+esc(u.uid)+'\',\''+esc(u.name||'')+'\')">Eliminar</button>';
    }
    actions+='<button class="sec" style="padding:8px 10px;font-size:11px;background:#1D9BF0" onclick="toggleVerified(\''+esc(u.uid)+'\','+(u.verified?'true':'false')+')">'+(u.verified?'Quitar ✓':'Verificar ✓')+'</button>';
    actions+='<button class="sec" style="padding:8px 10px;font-size:11px" onclick="editUserBadges(\''+esc(u.uid)+'\')">Insignias</button>';
    return '<div class="card" style="padding:12px"><div><b style="font-size:14px">'+esc(u.name||'Sin nombre')+'</b> '+tags+
      '<div class="muted" style="font-size:12px;margin-top:2px">'+esc(u.email||'sin email')+'</div>'+
      '<code style="margin:6px 0 0;font-size:10px">'+esc(u.uid)+'</code>'+
      (u.bio?'<div class="muted" style="font-size:12px;margin-top:4px">'+esc(u.bio)+'</div>':'')+
      '</div>'+(actions?'<div class="row" style="margin-top:10px">'+actions+'</div>':'')+'</div>';
  }).join('');
}
function editUserBadges(uid){
  var u=(_usersCache||[]).filter(function(x){return x.uid===uid})[0]||{};
  var current=Array.isArray(u.badges)?u.badges.slice():[];
  var options=['vip','mod','helper','partner','pro','og','staff'];
  var labels={vip:'VIP',mod:'MOD (moderador)',helper:'Helper',partner:'Partner',pro:'PRO',og:'OG',staff:'Staff'};
  var html='Insignias para este usuario (además de Verificado/Admin/Creador):\n\n';
  options.forEach(function(k,i){html+=(i+1)+') '+labels[k]+(current.indexOf(k)>=0?' [ON]':'')+'\n'});
  html+='\nEscribe las claves separadas por coma (ej: vip,pro)\nDeja vacío para quitar todas.\nActual: '+(current.join(',')||'ninguna');
  var ans=prompt(html, current.join(','));
  if(ans===null)return;
  var next=ans.split(',').map(function(x){return x.trim().toLowerCase()}).filter(function(x){return options.indexOf(x)>=0});
  db.collection('users').doc(uid).set({badges:next},{merge:true}).then(function(){
    toast('Insignias actualizadas');
    loadUsers();
  }).catch(function(e){console.log(e);toast('Error al guardar insignias',1)});
}
function toggleVerified(uid, isVer){
  var next = !(isVer===true || isVer==='true');
  db.collection('users').doc(uid).set({verified: next}, {merge:true}).then(function(){
    toast(next ? 'Usuario verificado' : 'Verificación quitada');
    loadUsers();
  }).catch(function(e){console.log(e);toast('Error',1)});
}
function banFromUsers(uid){
  var reason=prompt('Motivo del ban:','Spam')||'Sin motivo';
  db.collection('bans').doc(uid).set({reason:reason,bannedBy:auth.currentUser.uid,bannedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){toast('Usuario baneado');loadUsers()}).catch(function(){toast('Error',1)});
}
function makeAdminFromUsers(uid){
  if(!isCreator)return;
  db.collection('admins').doc(uid).set({addedBy:auth.currentUser.uid,addedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){toast('Ahora es admin');loadUsers()}).catch(function(){toast('Error',1)});
}

/* ===== GAMES ===== */
function resetGame(){
  editId=null;var ft=$('ft');if(ft)ft.textContent='Nuevo juego';
  ['f_title','f_dev','f_cat','f_img','f_apk','f_desc','f_log','f_sec','f_badge','f_label','f_media'].forEach(function(id){var el=$(id);if(el)el.value=''});
  if($('f_color'))$('f_color').value='#EF4444';if($('f_active'))$('f_active').checked=true;
}
function saveGame(){
  var title=$('f_title').value.trim(),img=$('f_img').value.trim(),apk=$('f_apk').value.trim();
  if(!title||!img||!apk)return toast('Título, imagen y APK obligatorios',1);
  var media=($('f_media').value||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(url){return{type:/youtu\.?be/.test(url)?'youtube':'image',url:url}});
  var data={title:title,developer:$('f_dev').value.trim()||'Veltrix',category:$('f_cat').value.trim()||'Otros',img:img,apk_url:apk,desc_game:$('f_desc').value.trim(),changelog:$('f_log').value.trim(),security_info:$('f_sec').value.trim(),badge_text:$('f_badge').value.trim(),label_text:$('f_label').value.trim(),label_color:$('f_color').value.trim()||'#EF4444',media:media,is_active:$('f_active').checked};
  var id=editId||db.collection('games').doc().id;
  var p=editId?Promise.resolve():db.collection('games').doc(id).set({createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  p.then(function(){return db.collection('games').doc(id).set(data,{merge:true})}).then(function(){toast('Juego guardado');resetGame();loadList()}).catch(function(e){console.log(e);toast('Error al guardar',1)});
}
function loadList(){
  db.collection('games').get().then(function(s){
    var l=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return(b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0)});
    window._l=l;
    var box=$('list');if(!box)return;
    box.innerHTML=l.length?l.map(function(g){return'<div class="card"><div class="item"><img src="'+esc(g.img)+'" alt=""><div style="flex:1;min-width:0"><b>'+esc(g.title)+'</b><small>'+esc(g.category||'')+' · '+(g.is_active===false?'Oculto':'Visible')+'</small></div></div><div class="row"><button class="sec" onclick="editGame(\''+esc(g.id)+'\')">Editar</button><button class="sec" onclick="toggleGame(\''+esc(g.id)+'\')">'+(g.is_active===false?'Mostrar':'Ocultar')+'</button><button class="dng" onclick="delGame(\''+esc(g.id)+'\')">Eliminar</button></div></div>'}).join(''):'<p class="muted">Sin juegos aún.</p>';
  }).catch(function(){var b=$('list');if(b)b.textContent='Error cargando juegos'});
}
function editGame(id){
  var g=(window._l||[]).filter(function(x){return x.id===id})[0];if(!g)return;
  editId=id;$('ft').textContent='Editando: '+g.title;
  $('f_title').value=g.title||'';$('f_dev').value=g.developer||'';$('f_cat').value=g.category||'';$('f_img').value=g.img||'';$('f_apk').value=g.apk_url||'';$('f_desc').value=g.desc_game||'';$('f_log').value=g.changelog||'';$('f_sec').value=g.security_info||'';$('f_badge').value=g.badge_text||'';$('f_label').value=g.label_text||'';$('f_color').value=g.label_color||'#EF4444';$('f_media').value=(g.media||[]).map(function(m){return m.url}).join('\n');$('f_active').checked=g.is_active!==false;window.scrollTo(0,0);
}
function toggleGame(id){var g=(window._l||[]).filter(function(x){return x.id===id})[0];if(!g)return;db.collection('games').doc(id).update({is_active:g.is_active===false}).then(loadList).catch(function(){toast('Error',1)})}
function delGame(id){if(!confirm('¿Eliminar juego?'))return;db.collection('games').doc(id).delete().then(function(){toast('Eliminado');loadList()}).catch(function(){toast('Error',1)})}
</script></body></html>
